blockExoticSubdeps: false
allowBuilds:
  # Git-hosted libs ship a built dist/ and run no scripts. `false` by NAME covers every
  # SHA; a name-level `true` makes pnpm 11 abort each new SHA as a "revoked" build.
  '@rodrigo-barraza/components-library': false
  '@rodrigo-barraza/utilities-library': false
  sharp: true
